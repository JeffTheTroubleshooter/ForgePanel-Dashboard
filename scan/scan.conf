# ForgePanel network scan configuration (INI format, lines starting with # or ; are comments)
# Used by scan/scan.py. Paths are relative to the scan/ folder.

[scan]
# "auto" = detect this machine's LAN IP and scan its /24.
# Or set a CIDR (192.168.1.0/24), a single host (127.0.0.1), or a comma list of both.
subnet = auto
# Safety cap: refuse to scan more hosts than this (a /22 is 1022 hosts)
max_hosts = 1024
# TCP connect timeout per port, in seconds
timeout = 0.6
# Concurrent connection attempts
threads = 128
# Grab the HTTP <title> / Server header of open ports to identify the service (yes/no)
http_probe = yes
# Encrypted output (opened by the dashboard with your login password)
output = results.enc
# Plain output, used only when the "cryptography" module is missing or --plain is given
plain_output = results.json

[schedule]
# Automatic scans run by server.py: off, hourly, daily or custom (uses minutes).
# The dashboard's Auto-scan setting overrides this once you save it there.
# New services from automatic scans show up under "New" in the dashboard to accept or dismiss.
interval = off
minutes = 360

[ports]
# port = candidate service names (comma separated, most likely first).
# These are only WEAK HINTS: they set the order endpoints are checked in. A service is never
# named from its port alone; without real evidence it is shown as 'Unknown service (host:port)'.
# A name that matches an official dashboard tile becomes that tile; anything else is a custom service.
80 = Nextcloud, TrueNAS, Pi-hole, AdGuard, Pterodactyl
81 = NPM
443 = Nextcloud, TrueNAS, Pterodactyl
2283 = Immich
3000 = AdGuard, Grafana
3001 = Uptime Kuma
4533 = Navidrome
8000 = Vaultwarden
8006 = Proxmox
8080 = Nextcloud, RomM, FileBrowser, TriliumNext, Pterodactyl
8081 = RomM
8082 = FileBrowser
8083 = TriliumNext
8096 = Jellyfin
8123 = Home Assistant
9000 = Portainer
9443 = Portainer
32400 = Plex

[https_ports]
# Ports that are usually HTTPS (self-signed certificates are accepted for probing only)
ports = 443, 8006, 9443

[fingerprints]
# Legacy title/Server keywords (used only by scan.identify()). Detection now uses the
# SIGNATURES table in scan.py: title, headers, cookie names, validated API/health endpoints.
jellyfin = Jellyfin
immich = Immich
nextcloud = Nextcloud
navidrome = Navidrome
vaultwarden = Vaultwarden
bitwarden = Vaultwarden
romm = RomM
adguard = AdGuard
filebrowser = FileBrowser
file browser = FileBrowser
trilium = TriliumNext
nginx proxy manager = NPM
proxmox = Proxmox
pve = Proxmox
truenas = TrueNAS
portainer = Portainer
pterodactyl = Pterodactyl
home assistant = Home Assistant
plex = Plex
pi-hole = Pi-hole
grafana = Grafana
uptime kuma = Uptime Kuma

[favicon_hashes]
# Optional: md5 of /favicon.ico = service name, used only when nothing else matched.
# 0123456789abcdef0123456789abcdef = Jellyfin

[official]
# Names of the built-in dashboard tiles (must match pages/dashboard.html)
names = Jellyfin, Navidrome, Immich, Nextcloud, Vaultwarden, RomM, AdGuard, FileBrowser, TriliumNext, TrueNAS, Proxmox, NPM
